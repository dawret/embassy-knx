[package]
name = "embassy-knx"
version = "0.1.0"
edition = "2021"

[features]
defmt = [
    "dep:defmt",
    "embassy-sync/defmt",
    "embassy-time/defmt",
    "embedded-io-async/defmt",
    "heapless/defmt",
]

[dependencies]
embassy-futures = { version = "0.1.2" }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1" }
embedded-io-async = { version = "0.7.0" }
embedded-hal = { version = "1.0.0" }

defmt = { version = "1.2", optional = true }

heapless = { version = "0.9" }
num_enum = { version = "0.7.6", default-features = false }

# heapless' pool needs 128-bit CAS on 64-bit targets (host tests); ARM uses LL/SC natively.
[target.'cfg(target_pointer_width = "64")'.dependencies]
heapless = { version = "0.9", features = ["portable-atomic"] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
futures-executor = "0.3.34"
